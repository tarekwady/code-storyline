       the second one blue. Black tile, white marks. Rendered to marketplace-icon.png (256×256). -->
  <rect width="256" height="256" rx="56" fill="#0f0f10" />
  <path d="M 78 86 L 44 128 L 78 170" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 178 86 L 212 128 L 178 170" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 102 128 L 154 128" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  <rect x="89" y="115" width="26" height="26" rx="7" fill="#ffffff" />
  <rect x="141" y="115" width="26" height="26" rx="7" fill="#3b86f5" />
</svg>
